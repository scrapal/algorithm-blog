<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">KMP 失配后的模式串移动</title>
  <desc id="desc">前五个字符匹配，第六个字符失配后，利用 ABABA 的最长相同真前后缀 ABA 将模式串右移两位。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 30px Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .label{font:600 22px Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}
      .char{font:700 30px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}
      .note{font:500 19px Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="1120" height="560" rx="24" fill="#f8fafc"/>
  <text x="560" y="54" class="title" text-anchor="middle">失配后利用最长相同真前后缀移动</text>

  <text x="55" y="133" class="label">文本串</text>
  <text x="55" y="223" class="label">模式串</text>

  <g>
    <rect x="208" y="95" width="64" height="58" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <rect x="296" y="95" width="64" height="58" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <rect x="384" y="95" width="64" height="58" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <rect x="472" y="95" width="64" height="58" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <rect x="560" y="95" width="64" height="58" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <rect x="648" y="95" width="64" height="58" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
    <rect x="736" y="95" width="64" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="824" y="95" width="64" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="240" y="124" class="char">A</text><text x="328" y="124" class="char">B</text>
    <text x="416" y="124" class="char">A</text><text x="504" y="124" class="char">B</text>
    <text x="592" y="124" class="char">A</text><text x="680" y="124" class="char">B</text>
    <text x="768" y="124" class="char">A</text><text x="856" y="124" class="char">C</text>
  </g>

  <g>
    <rect x="208" y="185" width="64" height="58" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <rect x="296" y="185" width="64" height="58" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <rect x="384" y="185" width="64" height="58" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <rect x="472" y="185" width="64" height="58" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <rect x="560" y="185" width="64" height="58" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <rect x="648" y="185" width="64" height="58" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
    <text x="240" y="214" class="char">A</text><text x="328" y="214" class="char">B</text>
    <text x="416" y="214" class="char">A</text><text x="504" y="214" class="char">B</text>
    <text x="592" y="214" class="char">A</text><text x="680" y="214" class="char">C</text>
  </g>

  <line x1="224" y1="273" x2="384" y2="273" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <line x1="400" y1="292" x2="608" y2="292" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <text x="225" y="319" class="note" fill="#2563eb">前缀 ABA</text>
  <text x="486" y="319" class="note" fill="#7c3aed">后缀 ABA</text>
  <text x="735" y="217" class="note" fill="#dc2626">B ≠ C，失配</text>

  <line x1="385" y1="347" x2="635" y2="347" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="510" y="390" class="note" text-anchor="middle">令 j=nxt[5]=3，模式串右移 2 位</text>

  <text x="55" y="465" class="label">移动后</text>
  <g>
    <rect x="384" y="427" width="64" height="58" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <rect x="472" y="427" width="64" height="58" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <rect x="560" y="427" width="64" height="58" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <rect x="648" y="427" width="64" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="736" y="427" width="64" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="824" y="427" width="64" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="416" y="456" class="char">A</text><text x="504" y="456" class="char">B</text>
    <text x="592" y="456" class="char">A</text><text x="680" y="456" class="char">B</text>
    <text x="768" y="456" class="char">A</text><text x="856" y="456" class="char">C</text>
  </g>
  <text x="384" y="524" class="note" fill="#2563eb">这三个字符已经匹配，不必重新比较</text>
</svg>
